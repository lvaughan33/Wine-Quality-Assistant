data:
  raw_path: data/raw/winequality-red.csv
  test_size: 0.2
  random_state: 42

model:
  target: quality

experiments:
  models:
    - name: linear_regression

    - name: ridge
      alpha: 1.0

    - name: random_forest_100
      n_estimators: 100
      max_depth: null

    - name: random_forest_300
      n_estimators: 300
      max_depth: null

    - name: gradient_boosting
      n_estimators: 100
      learning_rate: 0.1